name: Zápasy zo SZH

# GitHub spúšťa časované behy nespoľahlivo (niekedy s päťhodinovou dierou), preto je tu viac
# časovačov za hodinu. V zápasový deň prvý beh, ktorý sa spustí, zostane celý deň: robí hlavné
# sťahovanie zápasov a tabuliek, sleduje zápasy, ktoré sa hrajú, každú minútu a skončí po
# poslednom zápase. Ak deň trvá dlhšie ako beh (6 hodín), spustí ďalší sám.
on:
  schedule:
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = ako pri plánovanom behu, baseline = len hlavné sťahovanie, live = len zápasy naživo'
        type: choice
        options: [auto, baseline, live]
        default: auto
      dry_run:
        description: 'Skúška: nič sa nezapíše do databázy'
        type: boolean
        default: true

# Naraz beží len jedno sťahovanie; ďalšie počká, aby sa nepísalo do databázy dvakrát.
concurrency:
  group: szh-sync
  cancel-in-progress: false

permissions:
  contents: read
  # Na spustenie ďalšieho behu, keď zápasový deň trvá dlhšie ako jeden beh.
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ak zväz zmení web alebo sa pokazí kód, testy zlyhajú skôr, než sa niečo zapíše.
      - run: npm test

      - name: Sťahovanie
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MODE: ${{ inputs.mode || 'auto' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: node src/cli.js --mode "$MODE" $DRY_RUN --max-minutes 330

      # Zápasový deň ešte neskončil, ale beh vyčerpal čas: spustí sa ďalší (ostrý, nie skúška).
      - name: Pokračovanie
        if: ${{ hashFiles('continue.flag') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run szh-sync.yml --ref "$GITHUB_REF_NAME" -f mode=auto -f dry_run=false
